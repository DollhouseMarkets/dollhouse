// FeeVault: ledger solvency, fee conservation, the drawdown token bucket, the keeper leash
// and the post-sunset forwarding queue. PROTOCOL_SPEC I/J; PROPERTIES FEE-08/10/11, BID-05/07/14,
// CON-04/05, SUP-04.
// Run: certoraRun certora/conf/FeeVault.conf   (from a clean clone, CERTORAKEY in the environment)
// Build note: foundry.toml compiles with via_ir, so this conf sets solc_via_ir and mirrors the
// foundry remappings through `packages`.
//
// Linking (wiring read from script/Deploy.s.sol and the FeeVault constructor): the vault takes only
// the factory as a contract argument and reads `poolManager`, `hook`, `roundManager` and
// `bidDeployer` off it, so those four are immutables of this contract and `hook` / `roundManager`
// are linked to the real implementations, which are compiled in alongside.
//
// THE EDGE TOKEN IS LINKED, AND IT IS THE ONE NEW LINK OF THIS PASS. `EDGE` is an
// immutable `Currency` (a UDVT over `address`) that the constructor reads off
// `FamilyFactory.genesisToken()`. Unlinked it is havoc'd, and every
// `IERC20(Currency.unwrap(EDGE)).balanceOf` / `.safeTransfer` then lands on an unknown address: the
// balance half of `holdings(EDGE)` becomes a per-call havoc, on the currency
// that denominates EVERY ledger in the contract, and no payout rule can observe value leaving at
// all. `test/utils/MockDoll.sol` is the plain 18-decimal ERC-20 the test bases already
// deploy for this role: no hooks, no fee on transfer, no callbacks, which is exactly what the launch
// implementation is. It is compiled in and linked, and
// FeeVault.spec declares its `balanceOf` / `transfer` as EXACT entries so they run the real code
// instead of the wildcard consistent-read ghost.
// FIRST-RUN RISK, RECORDED RATHER THAN ASSUMED: this is the first link in these confs onto an
// immutable of a USER-DEFINED VALUE TYPE rather than a plain `address`. If the Prover refuses it,
// the fallback is to drop this link and the two exact `edgeDoll.*` entries, restore the
// `_.balanceOf(address)` wildcard for the edge currency as well, and re-state
// `valueLeavesOnlyOnPayoutMethods` over `holdings(EDGE)` with the weakening this implies.
// DELIBERATELY UNLINKED:
//   - poolManager: every PoolManager entrypoint is summarized NONDET in the spec (PROPERTIES
//     section 6); linking the v4 singleton would only add unsound-to-prove state and slow the job.
//   - factory / bidDeployer: the spec never calls into either. `bidDeployer` is compared as an
//     address only, and every factory read is covered by a wildcard summary. An unlinked address is
//     havoc'd, which is strictly MORE general than pinning it, so no rule is weakened.
// THREE MORE LEVERS AGAINST THE SCENE-LOADING CRASH WERE MEASURED AND THIS CONF CARRIES NONE OF THEM.
// `-relaxedPointerSemantics FeeVault:receiveForward` (Prover changelog 5.0.5) crashed at the
// IDENTICAL block id. A verification-only compilation change crashed too, at a DIFFERENT
// block id, so the new build really was analysed; plain legacy codegen is not even available
// here, because `FamilyHook._collect` is stack-too-deep without via-IR. An internal CVL summary of
// `holdings`, which is the only thing that would take the two external balance reads off
// `receiveForward`'s path without editing the contract, CANNOT BE WRITTEN: `holdings` is `public`,
// and the Prover's internal-function finders only cover `internal` and `private` functions, so the
// entry "does not appear in code" under either `function_finder_mode` (refused locally at no
// cost in prover minutes). Do not re-run the three.
{
    "files": [
        "contracts/FeeVault.sol",
        "contracts/FamilyHook.sol",
        "contracts/RoundManager.sol",
        "test/utils/MockDoll.sol"
    ],
    "verify": "FeeVault:certora/specs/FeeVault.spec",
    "solc": "solc0.8.26",
    "solc_via_ir": true,
    "solc_optimize": "200",
    "solc_evm_version": "cancun",
    "packages": [
        "forge-std=lib/forge-std/src",
        "v4-core=lib/v4-core",
        "@uniswap/v4-core=lib/v4-core",
        "v4-periphery=lib/v4-periphery",
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts",
        "openzeppelin-contracts=lib/openzeppelin-contracts",
        "solmate=lib/v4-core/lib/solmate",
        "permit2=lib/v4-periphery/lib/permit2"
    ],
    "optimistic_loop": true,
    "loop_iter": 3,
    "rule_sanity": "basic",
    "msg": "FeeVault",
    "optimistic_fallback": true,
    // The Certora autofinder instrumentation adds locals on top of an already stack-heavy
    // function, which pushes the via-IR build past "stack too deep" in FeeVault. The finders only
    // exist to let a spec observe or summarize INTERNAL functions; every summary in FeeVault.spec
    // targets an EXTERNAL function (a `_.` wildcard or an exact contract entry), and the
    // storage hooks are on storage rather than on calls, so turning them off costs no rule any
    // strength.
    // solc's DEFAULT via-IR Yul optimiser sequence. The Prover substitutes its own sequence here,
    // and that one omits the full inliner, which makes FeeVault/RoundManager/FamilyHook die with
    // "stack too deep" on functions foundry compiles cleanly. Note the space inside `gv i f`: the
    // Prover rewrites the literal substring `gvif` to `gvf` (dropping the full inliner) even in a
    // user-supplied sequence, and solc's step parser ignores whitespace - so the spaces are what
    // preserve the inliner. An optimiser sequence changes code layout, never behaviour, and this
    // is the same sequence foundry.toml builds the contracts with.
    "yul_optimizer_steps": "dhfoDgvulfnTUtnIf[xa[r]EscLMcCTUtTOntnfDIulLculVcul[j]Tpeulxa[rul]xa[r]cLgv i fCTUca[r]LSsTFOtfDnca[r]Iulc]jmul[jul]VcTOculjmul",
    "disable_source_finders": true,
    "disable_internal_function_instrumentation": true,
    "link": [
        "FeeVault:hook=FamilyHook",
        "FeeVault:roundManager=RoundManager",
        "FeeVault:EDGE=MockDoll"
    ]
}
