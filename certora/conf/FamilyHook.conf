// FamilyHook: the score accumulator, averageOver, the snipe-tax schedule and the fee-once rule at
// the EDGE. PROTOCOL_SPEC F/I; PROPERTIES SCR-01..06, FEE-01/03/04/06.
// There is no genesis pool and no native ETH edge. An EDGE pool is one whose parent is
// canonical index 0, the adopted genesis token, and the protocol fee is charged there and nowhere
// else, with the 1% suppressed for the three seconds the snipe tax is open. The spec MEANT to read
// both predicates off the swapped pool's own storage; the `PoolId` key type of that mapping cannot
// be named in CVL at this CLI version, so the two hooks and the two rules stated over them are
// disabled in the spec and both properties fall back to the fuzz and unit tiers. The manager still
// stays out; the note below records what the vault link was replaced with.
// Run: certoraRun certora/conf/FamilyHook.conf   (from a clean clone, CERTORAKEY in the environment)
// Build note: foundry.toml compiles with via_ir, so this conf sets solc_via_ir and mirrors the
// foundry remappings through `packages`.
//
// `contracts/FeeVault.sol` IS DELIBERATELY OUT OF THIS SCENE, AND THE
// `feeVault` LINK WITH IT. Every job that compiles that file dies about two minutes in with an
// internal Prover error (code 1693402113, a points-to invariant
// violation inside the return-buffer analysis) while transforming
// `FeeVault.receiveForward(uint256,uint256)`, before a single rule is checked. The crash is in
// scene loading, so ANY conf that compiles that file is blocked by it, and this conf would compile
// it only to satisfy one link and one exact summary entry. Dropping both is what lets the hook spec be
// checked at all. The vault is an unlinked address and its one call from this contract
// (`IFeeVault(feeVault).accrue(...)` in `_collect`) is carried by the `_.accrue(...)` wildcard
// summary in FamilyHook.spec, which records the call into the ghosts FEE-01 is stated over. No rule
// in FamilyHook.spec reads vault storage or calls a vault getter, so no rule loses its meaning; the
// one thing lost is an EXACT `FeeVault.accrue` entry, which cannot name a contract that is
// not in the scene. Put the file and the link back when the Prover can load them.
//
// Linking (wiring read from script/Deploy.s.sol and the FamilyHook constructor, whose argument
// order is poolManager, factory, locker, feeVault, router, hopFeePpm): `feeVault` is linked to
// the real implementation. Note `roundManager` is NOT an immutable here - the factory deploys the
// hook BEFORE the RoundManager, so it is a write-once storage address, resolved lazily off the
// factory; it is linked anyway so the slot points at the real contract.
// DELIBERATELY UNLINKED:
//   - poolManager: every PoolManager entrypoint is summarized NONDET in the spec (PROPERTIES
//     section 6), per the run instructions.
//   - factory / locker / router: only ever compared against msg.sender for the access guards
//     (locker is the only permitted liquidity adder, router the only sender whose hookData is
//     trusted). Havoc'ing them is strictly more general than pinning them, so no rule is weakened.
{
    "files": [
        "contracts/FamilyHook.sol",
        "contracts/RoundManager.sol"
    ],
    "verify": "FamilyHook:certora/specs/FamilyHook.spec",
    "solc": "solc0.8.26",
    "solc_via_ir": true,
    "solc_optimize": "200",
    "solc_evm_version": "cancun",
    "packages": [
        "forge-std=lib/forge-std/src",
        "v4-core=lib/v4-core",
        "@uniswap/v4-core=lib/v4-core",
        "v4-periphery=lib/v4-periphery",
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts",
        "openzeppelin-contracts=lib/openzeppelin-contracts",
        "solmate=lib/v4-core/lib/solmate",
        "permit2=lib/v4-periphery/lib/permit2"
    ],
    "optimistic_loop": true,
    "loop_iter": 6,
    "rule_sanity": "basic",
    "msg": "FamilyHook",
    "optimistic_fallback": true,
    // The Certora autofinder instrumentation adds locals on top of an already stack-heavy
    // function, which pushes the via-IR build past "stack too deep" in FeeVault. The finders only
    // exist to let a spec observe or summarize INTERNAL functions; every summary in FamilyHook.spec
    // targets an EXTERNAL function (a `_.` wildcard, or the exact `FeeVault.accrue` entry), and the
    // `isEdge` / `tradingStart` hooks are on STORAGE rather than on calls, so turning them
    // off costs no rule any strength.
    // solc's DEFAULT via-IR Yul optimiser sequence. The Prover substitutes its own sequence here,
    // and that one omits the full inliner, which makes FeeVault/RoundManager/FamilyHook die with
    // "stack too deep" on functions foundry compiles cleanly. Note the space inside `gv i f`: the
    // Prover rewrites the literal substring `gvif` to `gvf` (dropping the full inliner) even in a
    // user-supplied sequence, and solc's step parser ignores whitespace - so the spaces are what
    // preserve the inliner. An optimiser sequence changes code layout, never behaviour, and this
    // is the same sequence foundry.toml builds the contracts with.
    "yul_optimizer_steps": "dhfoDgvulfnTUtnIf[xa[r]EscLMcCTUtTOntnfDIulLculVcul[j]Tpeulxa[rul]xa[r]cLgv i fCTUca[r]LSsTFOtfDnca[r]Iulc]jmul[jul]VcTOculjmul",
    "disable_source_finders": true,
    "disable_internal_function_instrumentation": true,
    "link": [
        "FamilyHook:roundManager=RoundManager"
    ]
}
