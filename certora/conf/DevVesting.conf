// DevVesting: the vesting schedule, released monotonicity and the absence of any clawback or
// acceleration path. PROTOCOL_SPEC B.1; PROPERTIES VST-01..06.
// Run: certoraRun certora/conf/DevVesting.conf   (from a clean clone, CERTORAKEY in the environment)
// Build note: foundry.toml compiles with via_ir, so this conf sets solc_via_ir and mirrors the
// foundry remappings through `packages`.
{
    "files": [
        "contracts/DevVesting.sol",
        "contracts/FamilyToken.sol"
    ],
    "verify": "DevVesting:certora/specs/DevVesting.spec",
    "solc": "solc0.8.26",
    "solc_via_ir": true,
    "solc_optimize": "200",
    "solc_evm_version": "cancun",
    "packages": [
        "forge-std=lib/forge-std/src",
        "v4-core=lib/v4-core",
        "@uniswap/v4-core=lib/v4-core",
        "v4-periphery=lib/v4-periphery",
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts",
        "openzeppelin-contracts=lib/openzeppelin-contracts",
        "solmate=lib/v4-core/lib/solmate",
        "permit2=lib/v4-periphery/lib/permit2"
    ],
    "optimistic_loop": true,
    "loop_iter": 2,
    "rule_sanity": "basic",
    "msg": "DevVesting",
    "optimistic_fallback": true,
    "link": [
        "DevVesting:token=FamilyToken"
    ]
}
