// Sleeve: the Fenwick ancestor sleeve, verified through certora/harness/FenwickHarness.sol because
// FenwickRangeAdd is an internal library. PROTOCOL_SPEC J; PROPERTIES SLV-01..07.
// Run: certoraRun certora/conf/Sleeve.conf   (from a clean clone, CERTORAKEY in the environment)
// Build note: foundry.toml compiles with via_ir, so this conf sets solc_via_ir and mirrors the
// foundry remappings through `packages`. No links: the harness holds the tree itself and calls
// nothing outside the library.
{
    "files": [
        "certora/harness/FenwickHarness.sol"
    ],
    "verify": "FenwickHarness:certora/specs/Sleeve.spec",
    "solc": "solc0.8.26",
    "solc_via_ir": true,
    "solc_optimize": "200",
    "solc_evm_version": "cancun",
    "packages": [
        "forge-std=lib/forge-std/src",
        "v4-core=lib/v4-core",
        "@uniswap/v4-core=lib/v4-core",
        "v4-periphery=lib/v4-periphery",
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts",
        "openzeppelin-contracts=lib/openzeppelin-contracts",
        "solmate=lib/v4-core/lib/solmate",
        "permit2=lib/v4-periphery/lib/permit2"
    ],
    "optimistic_loop": true,
    // REVIEW-2 ROOT CAUSE of the SLV-03 vacuity. `FenwickRangeAdd._add` walks
    // `i = 1, 2, 4, ... 4096` while `i <= MAX_INDEX + 2 == 4097`, which is THIRTEEN iterations from
    // index 0 (the left edge every sleeve range-adds at), not twelve. At `loop_iter: 12` the
    // `optimistic_loop` assumption "the loop has exited by now" is UNSATISFIABLE on exactly those
    // paths, so every rule that forced a NON-ZERO sleeve through `addSleeve` had an unsatisfiable
    // precondition and came back "not violated" VACUOUSLY - which is precisely the set that failed
    // `rule_not_vacuous` in review-1 and again here (`noShareExceedsTheSleeve`,
    // `sumOfSharesNeverExceedsTheSleeveSmallM`, `genesisWeightIsTwiceTheTerminalWeight`), while the
    // rules that allow `sleeve == 0` (which short-circuits before the loop) passed sanity. The `2^128`
    // literal review-1 suspected was a real defect but not this one. 14 leaves a margin of one.
    "loop_iter": 14,
    "rule_sanity": "basic",
    // REVIEW-2: `genesisWeightIsTwiceTheTerminalWeight` (SLV-05) TIMED OUT at 417 s in review-1. The
    // rule is also bounded in the spec now; this raises the per-rule SMT budget as well. A timeout
    // is a tractability verdict, never a claim about the code.
    "smt_timeout": "900",
    "msg": "Sleeve (FenwickRangeAdd via FenwickHarness)",
    "optimistic_fallback": true
}
