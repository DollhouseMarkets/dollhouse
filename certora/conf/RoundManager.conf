// RoundManager: the round state machine, the random end, the append-only canonical history, the
// pure schedule and the edge-currency bond escrow. PROTOCOL_SPEC A/C/G; PROPERTIES RND-01..15,
// PAR-01, CON-01, REN-01.
// Index 0 is ADOPTED (`adoptGenesis`, factory only, once) rather than created, the bond is
// an ERC-20 escrow in the edge currency rather than `msg.value`, a forfeit that cannot be delivered
// is held in `pendingForfeits` and retried by `flushForfeits`, and both factory entrypoints carry
// the reentrancy guard.
// Run: certoraRun certora/conf/RoundManager.conf   (from a clean clone, CERTORAKEY in the environment)
// Build note: foundry.toml compiles with via_ir, so this conf sets solc_via_ir and mirrors the
// foundry remappings through `packages`.
//
// `contracts/FeeVault.sol` IS DELIBERATELY OUT OF THIS SCENE, AND THE
// `feeVault` LINK WITH IT. Every job that compiles that file dies about two minutes in with an
// internal Prover error (code 1693402113, a points-to invariant
// violation inside the return-buffer analysis) while transforming
// `FeeVault.receiveForward(uint256,uint256)`, before a single rule is checked. The crash is in
// scene loading, so ANY conf that compiles that file is blocked by it. RoundManager.spec already
// summarizes the whole vault away (`_.depositEdgeBidEarmark(uint256) => NONDET`, the only call this
// contract makes into it), so the file and the link would buy nothing but the crash: every rule
// below keeps exactly the claim it had, and the "arrival side" of RND-11 is delegated to
// FeeVault.spec in prose. Put the file and the link back when the Prover can load them.
//
// Linking (wiring read from script/Deploy.s.sol and the RoundManager constructor, whose argument
// order is factory, hook, feeVault, hFracWad, hMinFracWad, bond, maxIndex, steward, sunsetDelay,
// continuation, end): `hook` and `feeVault` are linked to the real implementations.
// DELIBERATELY UNLINKED:
//   - randomness (IRandomnessSource from `end.source`): `pin` / `fulfil` / `status` are summarized
//     in the spec, exactly as PROPERTIES section 6 requires, so no rule may depend on the drand
//     BN254 pairing.
//   - factory: only ever compared against msg.sender for the onlyFactory guard; havoc'ing it is
//     strictly more general than pinning it.
//   - priorRegistry: on a fresh trunk it is address(0), and in a continuation it is an EARLIER,
//     already-deployed contract, i.e. unknown code from this proof's point of view. Every
//     delegated read is summarized in the spec.
// - the EDGE CURRENCY. It CANNOT be linked here: this contract reaches it through
//     `edgeToken()`, which is `canonical(0)`, a storage read that may delegate to a prior registry,
//     not an immutable. `balanceOf` gets the consistent-read ghost treatment and `transfer` is
//     NONDET, which is the honest model of a token this protocol did not write. FeeVault.conf DOES
//     link it, because there the edge currency is an immutable; the consequence of not being able to
//     do the same here is a weaker RND-11 here than in FeeVault.spec.
{
    "files": [
        "contracts/RoundManager.sol",
        "contracts/FamilyHook.sol"
    ],
    "verify": "RoundManager:certora/specs/RoundManager.spec",
    "solc": "solc0.8.26",
    "solc_via_ir": true,
    "solc_optimize": "200",
    "solc_evm_version": "cancun",
    "packages": [
        "forge-std=lib/forge-std/src",
        "v4-core=lib/v4-core",
        "@uniswap/v4-core=lib/v4-core",
        "v4-periphery=lib/v4-periphery",
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts",
        "openzeppelin-contracts=lib/openzeppelin-contracts",
        "solmate=lib/v4-core/lib/solmate",
        "permit2=lib/v4-periphery/lib/permit2"
    ],
    "optimistic_loop": true,
    "loop_iter": 4,
    "rule_sanity": "basic",
    // `bondIsMonotoneInDepth` and the `rank` / `submitScore` legs of
    // `noTransitionIsPrivileged` TIME OUT at the default SMT budget. Two remedies apply: pin
    // `BOND_DOUBLING_EVERY` (done in the spec) and raise the per-rule SMT
    // budget from its default. A timeout is a tractability verdict, never a claim about the code, so
    // raising it changes nothing about what is proved - only how many of the rules get an answer.
    "smt_timeout": "1200",
    "msg": "RoundManager",
    "optimistic_fallback": true,
    // The Certora autofinder instrumentation adds locals on top of an already stack-heavy
    // function, which pushes the via-IR build past "stack too deep" in FeeVault. The finders only
    // exist to let a spec observe or summarize INTERNAL functions; every summary in RoundManager.spec
    // is an external `_.` wildcard, so turning them off costs no rule any strength.
    // solc's DEFAULT via-IR Yul optimiser sequence. The Prover substitutes its own sequence here,
    // and that one omits the full inliner, which makes FeeVault/RoundManager/FamilyHook die with
    // "stack too deep" on functions foundry compiles cleanly. Note the space inside `gv i f`: the
    // Prover rewrites the literal substring `gvif` to `gvf` (dropping the full inliner) even in a
    // user-supplied sequence, and solc's step parser ignores whitespace - so the spaces are what
    // preserve the inliner. An optimiser sequence changes code layout, never behaviour, and this
    // is the same sequence foundry.toml builds the contracts with.
    "yul_optimizer_steps": "dhfoDgvulfnTUtnIf[xa[r]EscLMcCTUtTOntnfDIulLculVcul[j]Tpeulxa[rul]xa[r]cLgv i fCTUca[r]LSsTFOtfDnca[r]Iulc]jmul[jul]VcTOculjmul",
    "disable_source_finders": true,
    "disable_internal_function_instrumentation": true,
    "link": [
        "RoundManager:hook=FamilyHook"
    ]
}
