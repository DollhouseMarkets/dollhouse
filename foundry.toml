[profile.default]
src = "contracts"
test = "test"
script = "script"
libs = ["lib"]
out = "out"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
bytecode_hash = "none"
gas_limit = "3000000000"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "ds-test/=lib/forge-std/lib/ds-test/src/",
  "v4-core/=lib/v4-core/",
  "@uniswap/v4-core/=lib/v4-core/",
  "v4-periphery/=lib/v4-periphery/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "solmate/=lib/v4-core/lib/solmate/",
  "permit2/=lib/v4-periphery/lib/permit2/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 32
depth = 64
fail_on_revert = false

# Symbolic checks: pure libraries only, no IR pipeline (semantics of pure math are identical), small compile.
[profile.halmos]
test = "test/halmos"
script = "test/halmos"
out = "out-halmos"
cache_path = "cache-halmos"
via_ir = false
# NOTE: forge's skip globs treat `*` as matching `/` too, so patterns must name files
# explicitly -- a glob like "contracts/*.sol" would swallow contracts/libraries/ as well.
skip = [
  "contracts/BidDeployer.sol",
  "contracts/DevVesting.sol",
  "contracts/FamilyFactory.sol",
  "contracts/FamilyHook.sol",
  "contracts/FamilyLens.sol",
  "contracts/FamilyRouter.sol",
  "contracts/FamilyToken.sol",
  "contracts/FeeVault.sol",
  "contracts/Locker.sol",
  "contracts/RoundManager.sol",
  "contracts/randomness/BN254.sol",
  "contracts/randomness/DrandSource.sol",
  "contracts/randomness/MockRandomnessSource.sol",
  "contracts/interfaces/IBidDeployer.sol",
  "contracts/interfaces/IBurnableERC20.sol",
  "contracts/interfaces/IFamilyHook.sol",
  "contracts/interfaces/IFeeVault.sol",
  "contracts/interfaces/ILocker.sol",
  "contracts/interfaces/IPriorRegistry.sol",
  "contracts/interfaces/IRandomnessSource.sol",
  "contracts/interfaces/IVersionFactory.sol",
]

# Medusa target: contracts plus the cheatcode-free harness only; no forge test suites.
[profile.medusa]
test = "test/medusa"
script = "test/medusa"
out = "out-medusa"
cache_path = "cache-medusa"
skip = ["test/properties/**", "test/fork/**", "test/halmos/**", "test/utils/**", "test/*.t.sol", "script/**"]
